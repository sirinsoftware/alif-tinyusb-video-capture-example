project:
  define:
    - CFG_TUSB_MCU: OPT_MCU_NONE
    - TUP_DCD_ENDPOINT_MAX: 4
    - TUD_OPT_RHPORT: 0
    - BOARD_TUD_MAX_SPEED: OPT_MODE_HIGH_SPEED
    - SECTION_USB_DMA_BUF: \"usb_dma_buf\"
    - CFG_TUSB_MEM_SECTION: __attribute__\(\(section\(SECTION_USB_DMA_BUF\)\)\)
    - CFG_TUSB_MEM_ALIGN: __attribute__\(\(aligned\(32\)\)\)
    - CFG_TUSB_RHPORT0_MODE: OPT_MODE_DEVICE
    
  groups:
    - group: TinyUSB Video capture example
      files:
        - file: src/main.c
        - file: src/usb_descriptors.c

    - group: Alif UART lib
      files:
        - file: ../lib/alif_common-app-utils/logging/uart_tracelib.c
    
    - group: Alif BSP & USB low level driver for TinyUSB device mode
      files:
        - file: ../lib/tinyusb/hw/bsp/alif/family.c
        - file: ../lib/tinyusb/src/portable/alif/alif_e7_dk/dcd_ensemble.c
        
    - group: TinyUSB
      files:
        - file: ../lib/tinyusb/src/tusb.c
        - file: ../lib/tinyusb/src/common/tusb_fifo.c
        - file: ../lib/tinyusb/hw/bsp/board.c
        - file: ../lib/tinyusb/src/device/usbd.c
        - file: ../lib/tinyusb/src/device/usbd_control.c
        - file: ../lib/tinyusb/src/class/video/video_device.c

  add-path:
    - ./
    - src/
    - ../lib/alif_common-app-utils/logging
    - ../lib/tinyusb/src/portable/alif/alif_e7_dk
    - ../lib/tinyusb/src
    - ../lib/tinyusb/hw
    - ../lib/tinyusb/hw/bsp/alif/boards/alif_e7_dk

  components:
    - component: ARM::CMSIS:CORE
    - component: AlifSemiconductor::Device:Startup
    - component: AlifSemiconductor::Device:SOC Peripherals:PINCONF
    - component: AlifSemiconductor::Device:SOC Peripherals:GPIO
    - component: AlifSemiconductor::CMSIS Driver:USART
    - component: Device:SOC Peripherals:MHU
    - component: Services:Secure Enclave:core&Source
    - component: Services:Secure Enclave:Initialization Helper&Source
    - component: AlifSemiconductor::BSP:Board Config
    - component: AlifSemiconductor::BSP:DevKit Config&DevKit-e7
      for-context:
        - +E7-HE
        - +E7-HP

  output:
    base-name: $Project$
    type:
      - elf
      - bin
